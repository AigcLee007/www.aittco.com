services:
  # 1. 数据库服务 (PostgresSQL 15)
  math-db:
    image: postgres:15-alpine
    container_name: math-db
    restart: always
    environment:
      - POSTGRES_USER=mathuser
      - POSTGRES_PASSWORD=mathpassword
      - POSTGRES_DB=mathdb
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. 前端服务 (Next.js)
  math-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: math-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 数据库连接
      - POSTGRES_PRISMA_URL=postgresql://mathuser:mathpassword@math-db:5432/mathdb?schema=public
      - POSTGRES_URL_NON_POOLING=postgresql://mathuser:mathpassword@math-db:5432/mathdb?schema=public
      # 身份认证
      - JWT_SECRET=9dd09675ddc24cc5b10adb946eb374cf
      - JWT_REFRESH_SECRET=f37c2428d96e46b374cf37c2428d96e4
      # API 密钥与地址
      - OPENAI_API_KEY=sk-ns8GxB1VMNsOm7Jm047oSc3tGF42QFJoQAStlcUaHoUeKI7b
      - GEMINI_API_KEY=sk-ns8GxB1VMNsOm7Jm047oSc3tGF42QFJoQAStlcUaHoUeKI7b
      - BACKEND_API_KEY=sk-ns8GxB1VMNsOm7Jm047oSc3tGF42QFJoQAStlcUaHoUeKI7b
      - OPENAI_API_HOST=https://api.aittco.com/v1
      - GEMINI_API_HOST=https://api.aittco.com
      - IMAGE_PROVIDER_API_HOST=https://api.aittco.com
    depends_on:
      - math-db
      - math-backend

  # 3. 后端服务 (FastAPI - 生图)
  math-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: math-backend
    restart: always
    ports:
      - "8000:8000"

networks:
  default:
    name: math-network
